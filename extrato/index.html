<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Extrato do mês · Central Financeira</title>
<link rel="stylesheet" href="../ui-premium.css">
<link rel="stylesheet" href="styles.css?v=1.15">
<link rel="stylesheet" href="../shell.css?v=2.6">
<script src="../shell.js?v=2.7"></script>
</head>
<body>
<header class="ex-top">
  <h1>Extrato do mês</h1>
</header>

<main class="ex-main" data-company-filter>
  <section class="ex-card fd-card" id="monthlyFolder">
    <div class="fd-head">
      <div class="fd-title">
        <div><strong>Pasta do mês</strong> <span id="monthlyName" class="fd-name" hidden></span><div id="monthlyStatus" class="fd-status" role="status"></div></div>
      </div>
      <div class="fd-actions">
        <button type="button" id="monthlyConnect" class="ex-btn ex-primary">Conectar pasta do mês</button>
        <button type="button" id="monthlyAllow" class="ex-btn ex-primary" hidden>Permitir acesso</button>
        <button type="button" id="monthlyRefresh" class="ex-btn" hidden>Atualizar pasta</button>
      </div>
    </div>
    <div class="ex-toolbar monthly-toolbar">
      <label class="ex-field"><span id="monthlyCompanyLabel">Empresa</span><select id="monthlyCompany" aria-labelledby="monthlyCompanyLabel"></select></label>
      <label class="ex-field" data-monthly-filter hidden><span>Dia da pasta</span><select id="monthlyDay"></select></label>
      <label class="ex-field" data-monthly-filter hidden><span>Banco</span><select id="monthlyBank"></select></label>
      <label class="ex-field" data-monthly-filter hidden><span>Extrato / conta</span><select id="monthlyFile"></select></label>
    </div>
    <div id="monthlyBrowse" hidden>
      <div class="fd-head">
        <p id="monthlyFileStatus" class="fd-status" role="status"></p>
        <button type="button" id="monthlyOpen" class="ex-btn" hidden>Baixar PDF original</button>
      </div>
    </div>
  </section>

  <section class="ex-card">
    <div class="ex-import">
      <label class="ex-drop">
        <input id="pdfFile" type="file" accept=".pdf,.xlsx,.xlsm,.xls,.csv" hidden>
        <span class="ex-drop-ico">PDF<br>XLS</span>
        <span><strong>Selecionar extrato (PDF ou Excel)</strong><small id="fileName">Nenhum arquivo selecionado</small></span>
      </label>
      <label class="ex-field" id="monthField" hidden>
        <span>Mês salvo</span>
        <select id="monthSelect"></select>
      </label>
    </div>

    <div id="preview" class="ex-preview" hidden>
      <div class="ex-preview-info">
        <strong id="previewTitle">—</strong>
        <span id="previewCols">—</span>
      </div>
      <label class="ex-field">
        <span>Mês do extrato</span>
        <input id="previewMonth" type="month">
      </label>
      <div class="ex-preview-actions">
        <button type="button" id="saveImport" class="ex-btn ex-primary">Salvar extrato</button>
        <button type="button" id="cancelImport" class="ex-btn">Cancelar</button>
      </div>
    </div>
    <div id="importMsg" class="ex-msg" role="status" hidden></div>
  </section>

  <section id="workArea" hidden>
    <div class="ex-card">
      <div class="ex-card-head">
        <h2>Somar</h2>
      </div>
      <div id="sumOptions" class="ex-chips" role="group" aria-label="Campos para somar"></div>
      <div id="sumTotals" class="ex-totals"></div>
    </div>

    <div class="ex-card">
      <div class="ex-toolbar">
        <label class="ex-field"><span>Dia</span><select id="daySelect"></select></label>
        <label class="ex-field"><span>Tipo</span>
          <select id="typeFilter">
            <option value="">Entradas e saídas</option>
            <option value="entrada">Entradas</option>
            <option value="saida">Saídas</option>
          </select>
        </label>

        <label class="ex-field ex-grow"><span>Buscar</span><input id="search" type="search" placeholder="Descrição ou responsável"></label>
        <button type="button" id="clearCf" class="ex-btn ex-quiet" hidden>Limpar filtros da tabela</button>
        <div class="ex-counts" id="statusCounts"></div>
      </div>
      <div class="ex-table-wrap">
        <table class="ex-table">
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
          <tfoot id="tfoot"></tfoot>
        </table>
        <div id="emptyRows" class="ex-empty" hidden>Nenhum lançamento nesta seleção.</div>
      </div>
      <div class="ex-foot">
        <span id="rowCount"></span>
        <button type="button" id="deleteMonth" class="ex-btn ex-danger">Excluir este mês</button>
      </div>
    </div>
  </section>
</main>

<datalist id="respList"></datalist>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<script src="core.js?v=1.10"></script>
<script src="app.js?v=1.15"></script>
<script src="monthly.js?v=1.2"></script>
</body>
</html>
